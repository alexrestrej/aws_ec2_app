###secrets parameter store###

  rSecretDatabase1ParameterStore:
    Type: AWS::SSM::Parameter
    Properties:
      Description: The load ARN Secret Manager for Database1 DB on parameter store
      Type: String
      Name: !Join ["-", [!Ref 'AWS::StackName', "db-Database1"]]
      Value: !Ref rSecretBDDatabase1

