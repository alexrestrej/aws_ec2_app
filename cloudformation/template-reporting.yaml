#####################role#############

  rEC2ReportingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Join ["-", [!Ref 'AWS::StackName' , "rol-ec2-reporting"]]
      PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/YOUR_GOVERNANCE_BOUNDARY_POLICY
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - ec2.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonSSMReadOnlyAccess
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - ec2.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: /
      Policies:
      - PolicyName: ec2tags
        PolicyDocument:
          Version: 2012-10-17
          Statement:
          - Action:
            - 'ec2:Describe*'
            - ec2:CreateTags
            Resource: !Join ['', ['arn:', !Ref 'AWS::Partition', ':ec2:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':instance/*']]
            Effect: Allow
      - PolicyName: GetMetrics-CW
        PolicyDocument:
          Version: 2012-10-17
          Statement:
          - Action:
            - cloudwatch:PutMetricAlarm
            - cloudwatch:TagResource
            - cloudwatch:UntagResource
            - cloudwatch:DescribeAlarms
            - cloudwatch:DescribeAlarmHistory
            - cloudwatch:ListDashboards
            - cloudwatch:PutDashboard
            - cloudwatch:PutMetricData
            - cloudwatch:PutMetricStream
            - cloudwatch:DeleteAlarms
            Resource: !Join ['', ['arn:', !Ref 'AWS::Partition', ':ec2:', !Ref 'AWS::Region', ':', !Ref 'AWS::AccountId', ':instance/*']]
            Effect: Allow
      - PolicyName: createSSMAssociationEC2
        PolicyDocument:
          Version: 2012-10-17
          Statement:
          - Action:
            - ssm:CreateAssociation
            Resource: arn:aws:ec2:*:*:*
            Effect: Allow
      - PolicyName: createSSMAssociation
        PolicyDocument:
          Version: 2012-10-17
          Statement:
          - Action:
            - ssm:CreateAssociationDocument
            Resource: arn:aws:ssm:*:*:*
            Effect: Allow
      - PolicyName: cwlogs
        PolicyDocument:
          Version: 2012-10-17
          Statement:
          - Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:DescribeLogGroups
              - logs:DescribeLogStreams
            Resource: arn:aws:logs:*:*:*
            Effect: Allow 
              
      - PolicyName: kmssessionlogging
        PolicyDocument:
          Version: 2012-10-17
          Statement:
          - Action:
            - 'kms:GenerateDataKey'
            - 'kms:Decrypt'
            Resource: arn:aws:kms:*:*:*
            Effect: Allow    


##Profile##

  rEC2ReportingProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - Ref: rEC2ReportingRole

###Policys###              

  rS3Policy:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: VisualEditor0
            Effect: Allow
            Action:
              - 's3:Get*'
              - 's3:Put*'
              - 's3:List*'
            Resource:
              - Fn::Sub: arn:aws:s3:::${pImportBase}*/*
              - Fn::Sub: arn:aws:s3:::${pImportBase}*

      PolicyName: !Join ["", [!Ref 'AWS::StackName' , "-install-bd"]]
      Roles:
        - !Ref rEC2ReportingRole 

  rCustomKMSPolicy:
    Type: 'AWS::IAM::Policy'
    Condition: enableCustomKMS
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: VisualEditor0
            Effect: Allow
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
            Resource: 
              - !Ref pCustomKMS
      PolicyName: !Join ["", [!Ref 'AWS::StackName' , "-kms-shared-policy"]]
      Roles:
        - !Ref rEC2ReportingRole

  rKMSPolicy:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: VisualEditor0
            Effect: Allow
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
            Resource: 
              - !Join ["", ["arn:aws:kms:",!Ref 'AWS::Region',":",!Ref 'AWS::AccountId',":key/{{resolve:ssm:", !Ref pPSKMS, "}}"]]

      PolicyName: !Join ["", [!Ref 'AWS::StackName' , "-kms-policy"]]
      Roles:
        - !Ref rEC2ReportingRole        


  rSecretCERTPolicy:
    Type: 'AWS::IAM::Policy'
    DependsOn:
    - SecretsManagerResourcePolicyCertificateEC201
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: VisualEditor0
            Effect: Allow
            Action: 'secretsmanager:GetSecretValue'
            Resource:
              - !Ref pSecretCert
      PolicyName: !Join ["", [!Ref 'AWS::StackName' , "-secret-cert-policy"]]
      Roles:
        - !Ref rEC2ReportingRole   


  rEC2IdParameterStore:
    Type: AWS::SSM::Parameter
    Properties:
        Description: Instance ID
        Type: String
        Name: !Join ["-", [!Ref 'AWS::StackName', "InstanceID"]]
        Value: !Ref rEC2ReportingInstance            

Outputs:
  rSecretARN:
    Value: !GetAtt InternalCertificateEC201.SecretArn
  rSecretCER:
    Value: !GetAtt InternalCertificateEC201.Cer                        





